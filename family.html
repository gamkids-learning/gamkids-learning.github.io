<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family - GamKids</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <img src="images/gamkids-logo.png"
         alt="GamKids"
         class="logo">
</header>
    <a href="index.html" class="back-button">← Home</a>

    <h1>Family</h1>
    <p class="lesson-intro">Learn family words in Mandinka!</p>

    <div class="family-grid">
        <button class="family-card" onclick="playSound('dad.m4a')">
        <img src="images/father.png" alt="Father" class="family-image">
        <span class="mandinka-word">Baba</span>
        <span class="english-word">Father</span>
        <span class="sound-icon">🔊</span>
    </button>

    <button class="family-card" onclick="playSound('Mum.m4a')">
        <img src="images/mother.png" alt="Mother" class="family-image">
        <span class="mandinka-word">Nmaa</span>
        <span class="english-word">Mother</span>
        <span class="sound-icon">🔊</span>
    </button>

    

    <button class="family-card" onclick="playSound('tata.m4a')">
       <img src="images/nkotoma.png" alt="Older Sister and Brother" class="family-image">
        <span class="mandinka-word">Tata</span>
        <span class="english-word">Older Sister / Brother</span>
        <span class="sound-icon">🔊</span>
    </button>

    <button class="family-card" onclick="playSound('ndoma.m4a')">
        <img src="images/ndoma.png" alt="Little Sister and Brother" class="family-image">
        <span class="mandinka-word">Ndoma</span>
        <span class="english-word">Little Sister / Brother</span>
        <span class="sound-icon">🔊</span>
    </button>
<button class="family-card" onclick="playSound('grandpa.m4a')">
       <img src="images/grandpa.png" alt="Grandfather" class="family-image">
        <span class="mandinka-word">Mama Ke</span>
        <span class="english-word">Grandfather</span>
        <span class="sound-icon">🔊</span>
    </button>
    <button class="family-card" onclick="playSound('grandma.m4a')">
        <img src="images/grandma.png" alt="Grandmother" class="family-image">
        <span class="mandinka-word">Mama Muso</span>
        <span class="english-word">Grandmother</span>
        <span class="sound-icon">🔊</span>
    </button>

   

</div>
    <script src="script.js"></script>

</body>
</html>
