<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numbers - GamKids</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<header>
    <img src="images/gamkids-logo.png"
         alt="GamKids"
         class="logo">
</header>
    <a href="index.html" class="back-button">← Home</a>
   

    <h1>Numbers 1–10</h1>
    <p class="lesson-intro">Tap a number to hear it in Mandinka!</p>

    <div class="number-grid">

        <button class="number-card" onclick="playSound('1.m4a')">
            <span class="big-number">1</span>
            <span class="mandinka-word">Kiling</span>
            <span class="sound-icon">🔊</span>
        </button>

        <button class="number-card" onclick="playSound('2.m4a')">
            <span class="big-number">2</span>
            <span class="mandinka-word">Fula</span>
            <span class="sound-icon">🔊</span>
        </button>

       <button class="number-card" onclick="playSound('3.m4a')">
            <span class="big-number">3</span>
            <span class="mandinka-word">Saba</span>
            <span class="sound-icon">🔊</span>
        </button>

       <button class="number-card" onclick="playSound('4.m4a')">
            <span class="big-number">4</span>
            <span class="mandinka-word">Nani</span>
            <span class="sound-icon">🔊</span>
        </button>

        <button class="number-card" onclick="playSound('5.m4a')">
            <span class="big-number">5</span>
            <span class="mandinka-word">Lulu</span>
            <span class="sound-icon">🔊</span>
        </button>

        <button class="number-card" onclick="playSound('6.m4a')">
            <span class="big-number">6</span>
            <span class="mandinka-word">Woro</span>
            <span class="sound-icon">🔊</span>
        </button>

        <button class="number-card" onclick="playSound('7.m4a')">
            <span class="big-number">7</span>
            <span class="mandinka-word">Worowula</span>
            <span class="sound-icon">🔊</span>
        </button>

       <button class="number-card" onclick="playSound('8.m4a')">
            <span class="big-number">8</span>
            <span class="mandinka-word">Sai</span>
            <span class="sound-icon">🔊</span>
        </button>

       <button class="number-card" onclick="playSound('9.m4a')">
            <span class="big-number">9</span>
            <span class="mandinka-word">Kononto</span>
            <span class="sound-icon">🔊</span>
        </button>

      <button class="number-card" onclick="playSound('10.m4a')">
            <span class="big-number">10</span>
            <span class="mandinka-word">Tang</span>
            <span class="sound-icon">🔊</span>
        </button>

    </div>

    <script src="script.js"></script>
</body>
</html>
